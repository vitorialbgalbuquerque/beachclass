<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Painel BC01</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="style.css?v=29">
</head><body>
<div id="app"></div><div id="modal"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script src="config.js?v=2"></script>
<script src="core.js?v=6"></script>
<script>
(function(){
const {Data,C,FLATS,FIDS,DAY,MESES,MS,esc,brl,T,iso,todayIso,dm,dmy,nightsBetween,numIn,monthShift,uuid,holidayAt,holidaysIn,holidaySuggestions,HTYPE,holidaySuggestionsYear,longWeekends}=BC;
const $=s=>document.querySelector(s);
const CATS=['Condomínio','Limpeza','Energia','Água','Internet','Manutenção','Enxoval e lavanderia','Reposição','IPTU','Outros'];
const S={flats:{},rates:[],bookings:[],expenses:[]};
let me=null,tab='cal',calMonth=todayIso().slice(0,7),finMonth=todayIso().slice(0,7),resFilter='next',ratesYear=+todayIso().slice(0,4),ratesFlat='',F=null,E=null,msg='';

const ICON={
 cal:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>',
 res:'<svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h7"/></svg>',
 rates:'<svg viewBox="0 0 24 24"><path d="M3 12l9-9h8v8l-9 9z"/><circle cx="15.5" cy="8.5" r="1.3"/></svg>',
 fin:'<svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
 site:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>',
 pct:'<svg viewBox="0 0 24 24"><path d="M19 5L5 19"/><circle cx="7" cy="7" r="2.5"/><circle cx="17" cy="17" r="2.5"/></svg>',
 in:'<svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>',
 cash:'<svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/></svg>',
 up:'<svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg>',
 down:'<svg viewBox="0 0 24 24"><path d="M3 7l6 6 4-4 8 8M15 17h6v-6"/></svg>'};
const TABS=[['cal','Calendário'],['res','Reservas'],['rates','Diárias'],['fin','Finanças'],['site','Site dos hóspedes']];

/* ---------- regras de preço ---------- */
const flatCfg=id=>{const f=S.flats.find?S.flats.find(x=>x.id===id):null;return {base:f?.base??null,base_we:f?.base_we??null,cleaning:f?.cleaning??null}};
const inSeason=(a,b,x)=>a<=b?(x>=a&&x<=b):(x>=a||x<=b);
function nightRate(fid,d){
  const rs=S.rates.filter(r=>r.flat===fid&&r.price!=null&&r.from_date&&r.to_date);
  const dow=new Date(T(d)).getUTCDay(),we=dow===5||dow===6; /* noites de sexta e sábado */
  const e=rs.find(r=>r.type==='especial'&&r.from_date<=d&&d<=r.to_date);if(e)return {p:+e.price,n:e.name||'Data especial'};
  const md=d.slice(5),s=rs.find(r=>r.type==='season'&&inSeason(r.from_date.slice(5),r.to_date.slice(5),md));
  if(s){const sep=s.price_we!=null&&s.price_we!=='';return {p:+(we&&sep?s.price_we:s.price),n:(s.name||'Temporada')+(sep?(we?' · fim de semana':' · semana'):'')}}
  const c=flatCfg(fid),sep=c.base_we!=null;if(c.base==null)return {p:null,n:'Diária base'};
  return {p:+(we&&sep?c.base_we:c.base),n:'Diária base'+(sep?(we?' · fim de semana':' · semana'):'')};
}
function quote(fid,ci,co){
  const q={nights:0,rent:0,groups:[],missing:0,cleaning:flatCfg(fid).cleaning==null?null:+flatCfg(fid).cleaning};
  if(!ci||!co||co<=ci)return q;const g={};
  for(let t=T(ci);t<T(co);t+=DAY){const r=nightRate(fid,iso(t));q.nights++;if(r.p==null){q.missing++;continue}const k=r.n+'|'+r.p;g[k]=g[k]||{name:r.n,price:r.p,nights:0};g[k].nights++;q.rent+=r.p}
  q.groups=Object.values(g);return q;
}
const paid=b=>(b.payments||[]).reduce((s,p)=>s+(Number(p.amount)||0),0);
const live=b=>b.status!=='cancelada';
const conflicts=(fid,ci,co,ex)=>S.bookings.filter(b=>b.id!==ex&&b.flat===fid&&live(b)&&ci<b.checkout&&co>b.checkin);
function occMap(fid){const m={};S.bookings.filter(b=>b.flat===fid&&live(b)).forEach(b=>{for(let t=T(b.checkin);t<T(b.checkout);t+=DAY)m[iso(t)]=b});return m}

/* ---------- dados ---------- */
async function reload(){try{Object.assign(S,await Data.loadAll())}catch(e){msg='Não foi possível carregar os dados. Confira a conexão.'}render()}
async function put(table,row){try{await Data.save(table,row);await reload();return true}catch(e){alert_('Não foi possível salvar: '+(e.message||'erro'));return false}}
async function drop(table,id){try{await Data.remove(table,id);await reload();return true}catch(e){alert_('Não foi possível excluir.');return false}}
function alert_(t){msg=t;render()}

/* ---------- casca ---------- */
function shell(title,mid,actions,body){
  return `<div class="shell"><aside class="side"><div class="logo"><div class="logo-m">BC</div><span>Beach Class</span></div>
  <nav class="nav" role="tablist">${TABS.map(([k,l])=>`<button class="tab" role="tab" data-tab="${k}" aria-selected="${tab===k}">${ICON[k]}<span>${l}</span></button>`).join('')}</nav>
  <div class="side-foot"><span>${esc(me?.email||'')}</span><button class="btn small" data-act="logout">Sair</button>${Data.live?'':'<span class="tag t-warn">Modo demonstração</span>'}</div></aside>
  <main class="main"><div class="main-in"><div class="top"><h1>${title}</h1><div>${mid||''}</div><div class="actions">${actions||''}</div></div>${msg?`<div class="notice"><span>${esc(msg)}</span><button class="btn small" data-act="clearmsg">Ok</button></div>`:''}${body}</div></main></div>`;
}
const monthPill=(ym,p,n)=>{const [y,m]=ym.split('-').map(Number);return `<div class="month"><button data-act="${p}" aria-label="Mês anterior">‹</button><b>${MESES[m-1]} ${y}</b><button data-act="${n}" aria-label="Próximo mês">›</button></div>`};
const kpi=(l,v,s,ic,col)=>`<div class="card kpi c4" style="--ic:${col}"><div class="l">${l}</div><div class="v">${v}</div><div class="ico">${ICON[ic]}</div><div class="s">${s||''}</div></div>`;

function render(){
  const app=$('#app');
  if(me===false){app.innerHTML=loginHtml();return}
  if(!me){app.innerHTML='';return}
  const v={cal:vCal,res:vRes,rates:vRates,fin:vFin,site:vSite}[tab]();
  app.innerHTML=shell(...v);
  if(F)sheet(true);
}
function loginHtml(){return `<div class="login"><form class="card" id="loginf"><div class="logo"><div class="logo-m">BC</div><span>Painel Beach Class</span></div><h1>Entrar</h1><div class="muted" style="font-size:14px">Acesso restrito aos administradores.</div>
 <label>E-mail<input id="lg-email" type="email" autocomplete="username" required></label><label>Senha<input id="lg-pw" type="password" autocomplete="current-password" required></label>
 ${msg?`<div class="warnbox">${esc(msg)}</div>`:''}<button class="btn primary" style="justify-content:center">Entrar</button></form></div>`}

/* ---------- feriadões ---------- */
const lwName=l=>l.names.some(n=>/Carnaval/.test(n))?'Carnaval':(l.names.filter(n=>!/Cinzas/.test(n)).join(' + '));
const lwPriced=(fid,l)=>{for(let t=T(l.from);t<=T(l.to);t+=DAY){const d=iso(t);if(!S.rates.some(r=>r.flat===fid&&r.type==='especial'&&r.price!=null&&r.from_date&&r.from_date<=d&&d<=r.to_date))return false}return true};
const lwHasRow=(fid,l)=>S.rates.some(r=>r.flat===fid&&r.type==='especial'&&r.from_date&&r.from_date<=l.to&&l.from<=r.to_date);
const lwTitle=l=>`${dm(l.from)} a ${dm(l.to)} · ${l.days} dias`;
function lwCard(){
  const td=todayIso(),lws=longWeekends(td,iso(T(td)+200*DAY)).slice(0,4);
  if(!lws.length)return '';
  return `<div class="card c12 lw"><div class="card-h"><h2>Feriadões chegando</h2><span class="muted" style="font-size:13px">Próximos 200 dias</span></div>${lws.map(l=>{
    const occ=FIDS.map(fid=>{const m=occMap(fid);let n=0;for(let t=T(l.from);t<=T(l.to);t+=DAY)if(m[iso(t)])n++;return n});
    return `<div class="r"><div><div class="d1">${esc(lwName(l))}</div><div class="d2">${lwTitle(l)}${l.emenda?' · com emenda':''}${l.fac?' · ponto facultativo':''}</div></div>
    <div class="st">${FIDS.map((fid,i)=>`<span class="tag ${lwPriced(fid,l)?'t-ok':'t-bad'}">${FLATS[fid].name.split(' ')[0]}: ${lwPriced(fid,l)?'preço definido':'sem preço'} · ${occ[i]}/${l.days} ocupadas</span>`).join('')}</div>
    <button class="btn small" data-act="gorates" data-year="${l.from.slice(0,4)}">Diárias</button></div>`}).join('')}</div>`;
}

/* ---------- calendário ---------- */
function vCal(){
  const [y,m]=calMonth.split('-').map(Number),days=new Date(Date.UTC(y,m,0)).getUTCDate(),lead=new Date(Date.UTC(y,m-1,1)).getUTCDay(),td=todayIso();
  const st=monthStats(calMonth),nxt=S.bookings.filter(b=>b.kind==='reserva'&&b.status!=='cancelada'&&b.checkin>=td).sort((a,b)=>a.checkin.localeCompare(b.checkin))[0];
  const open=S.bookings.filter(b=>b.kind==='reserva'&&b.status==='confirmada'&&b.total-paid(b)>0.005).reduce((s,b)=>s+b.total-paid(b),0);
  let h=`<div class="grid">${kpi('Ocupação do mês',st.occPct.toFixed(0)+'%',`${st.occ} noites ocupadas${st.blk?`, ${st.blk} bloqueadas`:''}`,'pct','#1B8F94')}${kpi('Próxima entrada',nxt?dm(nxt.checkin):'—',nxt?`${esc(nxt.guest||'Sem nome')} · ${FLATS[nxt.flat].name}`:'Nenhuma reserva futura','in','#C79A3B')}${kpi('A receber',brl(open),'Saldo das reservas confirmadas','cash','#E5484D')}</div><div class="grid">`;
  h+=lwCard();
  FIDS.forEach(fid=>{
    const occ=occMap(fid);let c=['D','S','T','Q','Q','S','S'].map(x=>`<div class="dow">${x}</div>`).join('');
    for(let i=0;i<lead;i++)c+='<div class="d out"></div>';
    for(let d=1;d<=days;d++){
      const ds=`${calMonth}-${String(d).padStart(2,'0')}`,b=occ[ds];let cls='d';if(ds<td)cls+=' past';if(ds===td)cls+=' today';let nm='';const hd=holidayAt(ds);if(hd)cls+=' hol '+hd.t;
      if(b){cls+=b.kind==='bloqueio'?' b':(b.status==='confirmada'?' c':' p');if(ds===b.checkin||d===1||new Date(T(ds)).getUTCDay()===0)nm=esc(b.kind==='bloqueio'?'Bloqueio':(b.guest||'').split(' ')[0])}
      c+=`<button class="${cls}" data-day="${ds}" data-flat="${fid}" ${b?`data-bk="${b.id}"`:''} aria-label="${d} ${b?'ocupado':'livre'}${hd?', '+hd.n:''}" ${hd?`title="${esc(hd.n)}${hd.t==='fac'?' (ponto facultativo)':''}"`:''}><span>${d}${hd?'<i class="hdot"></i>':''}</span>${hd?`<span class="hn">${esc(hd.n)}</span>`:''}${nm?`<span class="nm">${nm}</span>`:''}</button>`;
    }
    h+=`<div class="card c6"><div class="card-h"><h2>${FLATS[fid].name}</h2><span class="muted" style="font-size:13px">${FLATS[fid].loc}</span></div><div class="mon">${c}</div></div>`;
  });
  const hm=holidaysIn(calMonth+'-01',calMonth+'-'+String(days).padStart(2,'0'));
  h+=`</div><div class="hlist">${hm.length?hm.map(x=>`<span><i class="hdot ${x.t==='fac'?'fac':''}"></i><b>${x.d.slice(8,10)}/${x.d.slice(5,7)}</b> ${esc(x.n)}${x.t==='fac'?' (ponto facultativo)':''}</span>`).join(''):'<span class="muted">Sem feriados neste mês.</span>'}</div><div class="legend"><span><i style="background:color-mix(in srgb,var(--accent) 16%,var(--surface))"></i>Confirmada</span><span><i style="background:color-mix(in srgb,var(--sand) 22%,var(--surface))"></i>Pré-reserva</span><span><i style="background:var(--line)"></i>Bloqueio dos donos</span><span><i class="hdot" style="display:inline-block;vertical-align:1px;margin-right:5px"></i>Feriado</span><span><i class="hdot fac" style="display:inline-block;vertical-align:1px;margin-right:5px"></i>Ponto facultativo</span><span>Toque num dia livre para reservar</span></div>`;
  return ['Calendário',monthPill(calMonth,'mprev','mnext'),'<button class="btn" data-act="newblock">Bloquear datas</button><button class="btn primary" data-act="newres">Nova reserva</button>',h];
}

/* ---------- reservas ---------- */
function vRes(){
  const td=todayIso();let l=S.bookings.slice();
  if(resFilter==='next')l=l.filter(b=>b.checkout>=td&&live(b)).sort((a,b)=>a.checkin.localeCompare(b.checkin));
  else if(resFilter==='past')l=l.filter(b=>b.checkout<td&&live(b)).sort((a,b)=>b.checkin.localeCompare(a.checkin));
  else l=l.filter(b=>!live(b)).sort((a,b)=>b.checkin.localeCompare(a.checkin));
  const open=S.bookings.filter(b=>b.kind==='reserva'&&b.status==='confirmada'&&b.total-paid(b)>0.005);
  let h='';
  if(open.length)h+=`<div class="notice"><span>A receber de reservas confirmadas: <b>${brl(open.reduce((s,b)=>s+b.total-paid(b),0))}</b> em ${open.length} reserva${open.length>1?'s':''}.</span></div>`;
  h+=`<div class="card"><div class="seg" style="margin-bottom:8px">${[['next','Próximas'],['past','Passadas'],['canc','Canceladas']].map(([k,t])=>`<button data-filter="${k}" aria-pressed="${resFilter===k}">${t}</button>`).join('')}</div>`;
  if(!l.length)h+=`<div class="empty">${resFilter==='next'?'Nenhuma reserva futura. Use Nova reserva ou escolha um dia no calendário.':'Nada por aqui.'}</div>`;
  l.forEach(b=>{
    const n=nightsBetween(b.checkin,b.checkout),ini=(b.kind==='bloqueio'?'B':(b.guest||'?')[0]).toUpperCase();
    if(b.kind==='bloqueio')h+=`<div class="item" data-bk="${b.id}"><div class="av" style="--c:#6F6B68">${ini}</div><div><b>Bloqueio: ${esc(b.guest||'dos donos')}</b><span class="muted">${FLATS[b.flat].name} · ${dm(b.checkin)} a ${dm(b.checkout)} · ${n} noite${n>1?'s':''}</span></div><div class="r"><span class="tag t-block">Bloqueado</span></div></div>`;
    else{const sal=b.total-paid(b),pill=!live(b)?'<span class="tag t-bad">Cancelada</span>':b.status==='pre'?'<span class="tag t-warn">Pré-reserva</span>':(sal>0.005?`<span class="tag t-warn">Saldo ${brl(sal)}</span>`:'<span class="tag t-ok">Quitada</span>');
      h+=`<div class="item" data-bk="${b.id}"><div class="av">${esc(ini)}</div><div><b>${esc(b.guest||'Sem nome')}</b><span class="muted">${FLATS[b.flat].name} · ${dm(b.checkin)} a ${dm(b.checkout)} · ${n} noite${n>1?'s':''}${b.guests?` · ${b.guests} pessoas`:''}</span></div><div class="r"><b>${brl(b.total)}</b>${pill}</div></div>`}
  });
  return ['Reservas','','<button class="btn primary" data-act="newres">Nova reserva</button>',h+'</div>'];
}

/* ---------- diárias ---------- */
const dmSel=(r,f)=>{const v=r[f]||'2000-01-01',m=+v.slice(5,7)||1,d=+v.slice(8,10)||1;return `<div class="dmr"><select data-rate="${r.id}" data-f="${f}" data-part="d">${Array.from({length:31},(_,i)=>`<option value="${i+1}"${i+1===d?' selected':''}>${i+1}</option>`).join('')}</select><select data-rate="${r.id}" data-f="${f}" data-part="m">${MESES.map((n,i)=>`<option value="${i+1}"${i+1===m?' selected':''}>${n}</option>`).join('')}</select></div>`};
const lwRow=(fid,l)=>S.rates.find(r=>r.flat===fid&&r.type==='especial'&&r.from_date===l.from&&r.to_date===l.to)||S.rates.find(r=>r.flat===fid&&r.type==='especial'&&r.from_date&&r.from_date<=l.to&&l.from<=r.to_date);
const money=(id,f,v,extra='')=>`<div class="money"><span>R$</span><input inputmode="decimal" ${extra} data-rate="${id}" data-f="${f}" value="${v??''}" placeholder="0"></div>`;
function vRates(){
  const y0=+todayIso().slice(0,4),YEARS=[y0,y0+1,y0+2];if(!YEARS.includes(ratesYear))ratesYear=y0;
  if(!FIDS.includes(ratesFlat))ratesFlat=FIDS[0];
  const fid=ratesFlat,yStr=String(ratesYear),yStart=ratesYear===y0?todayIso():yStr+'-01-01',c=flatCfg(fid);
  const lws=longWeekends(yStart,yStr+'-12-31').filter(l=>l.from.slice(0,4)===yStr),used=new Set();
  lws.forEach(l=>{const r=lwRow(fid,l);if(r)used.add(r.id)});
  const missing=lws.filter(l=>!lwPriced(fid,l)).length;
  const seas=S.rates.filter(r=>r.flat===fid&&r.type==='season').sort((x,y)=>(x.from_date||'').slice(5).localeCompare((y.from_date||'').slice(5)));
  const other=S.rates.filter(r=>r.flat===fid&&r.type==='especial'&&(r.from_date||'').slice(0,4)===yStr&&!used.has(r.id)).sort((x,y)=>(x.from_date||'').localeCompare(y.from_date||''));
  const dt=l=>`${dm(l.from)} a ${dm(l.to)}`;
  let h=`<div class="rs">
  ${FIDS.length>1?`<div class="ypills" style="margin-bottom:14px">${FIDS.map(f=>`<button data-fpill="${f}" aria-pressed="${f===fid}">${FLATS[f].name}</button>`).join('')}</div>`:''}
  <div class="card"><div class="rsh"><span class="n">1</span><div><h2>Preço normal</h2><p>Valor da noite fora de feriado e fora da alta temporada.</p></div></div>
    <div class="rgrid"><label>Domingo a quinta<div class="money"><span>R$</span><input inputmode="decimal" data-flatfield="base" data-flat="${fid}" value="${c.base??''}" placeholder="0"></div></label>
    <label>Sexta e sábado<div class="money"><span>R$</span><input inputmode="decimal" data-flatfield="base_we" data-flat="${fid}" value="${c.base_we??''}" placeholder="igual ao outro"></div></label>
    <label>Limpeza (cobrada 1 vez por estadia)<div class="money"><span>R$</span><input inputmode="decimal" data-flatfield="cleaning" data-flat="${fid}" value="${c.cleaning??''}" placeholder="0"></div></label></div></div>
  <div class="card"><div class="rsh"><span class="n">2</span><div><h2>Alta temporada</h2><p>Época do ano em que o preço sobe. Vale todo ano.</p></div></div>
    ${seas.length?seas.map(r=>`<div class="rbox"><label>Nome<input data-rate="${r.id}" data-f="name" value="${esc(r.name||'')}" placeholder="Ex.: Verão"></label>
      <div class="rgrid"><div class="dm"><span>Começa em</span>${dmSel(r,'from_date')}</div><div class="dm"><span>Termina em</span>${dmSel(r,'to_date')}</div></div>
      <div class="rgrid"><label>Domingo a quinta${money(r.id,'price',r.price)}</label><label>Sexta e sábado${money(r.id,'price_we',r.price_we)}</label></div>
      <button class="btn danger small" data-delrate="${r.id}">Remover este período</button></div>`).join(''):'<p class="muted">Nenhum período cadastrado. Vale o preço normal o ano todo.</p>'}
    <button class="btn" data-addrate="season" data-flat="${fid}">+ Adicionar período de alta temporada</button></div>
  <div class="card"><div class="rsh"><span class="n">3</span><div><h2>Feriados</h2><p>Preço da noite nos feriadões. Se deixar em branco, vale o preço normal.</p></div></div>
    <div class="ypills" style="margin:4px 0 10px">${YEARS.map(y=>`<button data-ypill="${y}" aria-pressed="${y===ratesYear}">${y}</button>`).join('')}</div>
    ${missing?`<div class="warnbox" style="margin-bottom:10px">Faltam preços em ${missing} ${missing>1?'feriados':'feriado'} de ${ratesYear}.</div>`:(lws.length?'<div class="okbox" style="margin-bottom:10px">Todos os feriados de '+ratesYear+' têm preço.</div>':'')}
    ${lws.map(l=>{const r=lwRow(fid,l);return `<div class="fer ${lwPriced(fid,l)?'':'falta'}"><div class="ft"><b>${esc(lwName(l))}</b><span>${dt(l)} · ${l.days} dias${l.fac?' · ponto facultativo':''}${l.emenda?' · com emenda':''}</span></div>
      <div class="money"><span>R$</span><input inputmode="decimal" data-lwprice="${l.from}|${l.to}|${esc(lwName(l))}" data-flat="${fid}" value="${r&&r.price!=null?r.price:''}" placeholder="preço por noite"></div></div>`}).join('')||'<p class="muted">Nenhum feriadão a partir de hoje neste ano.</p>'}
  </div>
  <div class="card"><div class="rsh"><span class="n">4</span><div><h2>Outras datas especiais de ${ratesYear}</h2><p>Para qualquer data com preço diferente (evento, réveillon, etc.).</p></div></div>
    ${other.map(r=>`<div class="rbox"><label>Nome<input data-rate="${r.id}" data-f="name" value="${esc(r.name||'')}" placeholder="Ex.: Réveillon"></label>

/* ---------- finanças ---------- */
function monthStats(ym,fid){
  const bk=S.bookings.filter(b=>b.kind==='reserva'&&b.status==='confirmada'&&(!fid||b.flat===fid));
  const rev=bk.filter(b=>b.checkin.slice(0,7)===ym).reduce((s,b)=>s+(+b.total||0),0);
  const cash=S.bookings.filter(b=>b.kind==='reserva'&&live(b)&&(!fid||b.flat===fid)).reduce((s,b)=>s+(b.payments||[]).filter(p=>(p.date||'').slice(0,7)===ym).reduce((x,p)=>x+(Number(p.amount)||0),0),0);
  let exp=0;S.expenses.filter(e=>(e.date||'').slice(0,7)===ym).forEach(e=>{const a=+e.amount||0;if(!fid)exp+=a;else if(e.flat===fid)exp+=a;else if(e.flat==='ambos')exp+=a/2});
  const [y,m]=ym.split('-').map(Number),dd=new Date(Date.UTC(y,m,0)).getUTCDate();let occ=0,blk=0;
  S.bookings.filter(b=>live(b)&&(!fid||b.flat===fid)).forEach(b=>{if(b.kind==='reserva'&&b.status!=='confirmada')return;for(let t=T(b.checkin);t<T(b.checkout);t+=DAY)if(iso(t).slice(0,7)===ym){b.kind==='bloqueio'?blk++:occ++}});
  return {rev,cash,exp,profit:rev-exp,occ,blk,occPct:occ/(dd*(fid?1:2))*100};
}
function vFin(){
  const [y]=finMonth.split('-').map(Number),a=monthStats(finMonth),open=S.bookings.filter(b=>b.kind==='reserva'&&b.status==='confirmada'&&b.total-paid(b)>0.005).reduce((s,b)=>s+b.total-paid(b),0);
  let h=`<div class="grid">${kpi('Lucro do mês',`<span class="${a.profit<0?'neg':''}">${brl(a.profit)}</span>`,'Receita menos despesas','up','#22A04B')}${kpi('Receita',brl(a.rev),'Reservas confirmadas com entrada no mês','cash','#1B8F94')}${kpi('Despesas',brl(a.exp),'Lançadas no mês','down','#E5484D')}${kpi('Recebido no mês',brl(a.cash),'Pagamentos com data no mês','in','#2F6FDB')}${kpi('A receber',brl(open),'Saldo de todas as reservas confirmadas','cash','#C79A3B')}${kpi('Ocupação',a.occPct.toFixed(0)+'%',`${a.occ} noites`,'pct','#7A4FD1')}</div>`;
  h+=`<div class="grid"><div class="card c12"><h2>Por flat</h2><div class="sub">Despesas lançadas em "Os dois" são divididas igualmente.</div><div class="tw"><table><tr><th></th><th>Receita</th><th>Despesas</th><th>Lucro</th><th>Noites</th></tr>${FIDS.map(f=>{const s=monthStats(finMonth,f);return `<tr><td>${FLATS[f].name}</td><td>${brl(s.rev)}</td><td>${brl(s.exp)}</td><td class="${s.profit<0?'neg':''}">${brl(s.profit)}</td><td>${s.occ}${s.blk?` (+${s.blk} bloq.)`:''}</td></tr>`}).join('')}</table></div></div>`;
  const rows=[];for(let i=0;i<12;i++)rows.push(monthStats(`${y}-${String(i+1).padStart(2,'0')}`));
  const mx=Math.max(1,...rows.flatMap(s=>[s.rev,s.exp])),yr=rows.reduce((s,x)=>s+x.rev,0),ye=rows.reduce((s,x)=>s+x.exp,0);
  h+=`<div class="card c12"><div class="card-h"><h2>${y} mês a mês</h2><span class="muted" style="font-size:13px"><i class="swd" style="background:var(--accent)"></i>receita<i class="swd" style="background:var(--sand)"></i>despesas</span></div><div class="bars">${rows.map((s,i)=>`<div class="bar"><div class="pair"><span class="rv" style="height:${s.rev/mx*100}%"></span><span class="ex" style="height:${s.exp/mx*100}%"></span></div><small>${MS[i]}</small></div>`).join('')}</div><div class="muted" style="margin-top:10px;font-size:13px">No ano: receita ${brl(yr)} · despesas ${brl(ye)} · lucro <b class="${yr-ye<0?'neg':'pos'}">${brl(yr-ye)}</b></div></div>`;
  const ex=S.expenses.filter(e=>(e.date||'').slice(0,7)===finMonth).sort((a,b)=>b.date.localeCompare(a.date));
  h+=`<div class="card c12"><h2>Despesas do mês</h2>`;
  if(!ex.length)h+='<div class="empty">Nenhuma despesa lançada neste mês.</div>';
  ex.forEach(e=>{h+=`<div class="item" data-exp="${e.id}"><div class="av" style="--c:#E5484D">${esc((e.cat||'?')[0])}</div><div><b>${esc(e.descr||e.cat)}</b><span class="muted">${dm(e.date)} · ${esc(e.cat||'')} · ${e.flat==='ambos'?'Os dois':FLATS[e.flat]?.name||''}</span></div><div class="r"><b>${brl(e.amount)}</b></div></div>`});
  return ['Finanças',monthPill(finMonth,'fprev','fnext'),'<button class="btn primary" data-act="newexp">Lançar despesa</button>',h+'</div></div>'];
}

const calcF=()=>{const q=quote(F.flat,F.checkin,F.checkout),adj=numIn(F.adjust)||0;return {...q,adj,total:q.rent+(q.cleaning||0)+adj}};

function warns(){const cf=conflicts(F.flat,F.checkin,F.checkout,F.id);const hs=F.checkout>F.checkin?holidaysIn(F.checkin,F.checkout):[];return `${hs.length?`<div class="infobox" style="margin-top:8px"><b>Feriados na estadia:</b> ${hs.map(h=>`${dm(h.d)} ${esc(h.n)}${h.t==='fac'?' (ponto facultativo)':''}`).join('; ')}. Se tiverem preço especial, cadastre em Diárias.</div>`:''}${F.checkout<=F.checkin?'<div class="warnbox">A saída precisa ser depois da entrada.</div>':''}${cf.length&&F.status!=='cancelada'?`<div class="warnbox">Estas datas já estão ocupadas: ${cf.map(b=>`${esc(b.guest||'Bloqueio')} (${dm(b.checkin)} a ${dm(b.checkout)})`).join(', ')}.</div>`:''}${F.err?`<div class="warnbox">${esc(F.err)}</div>`:''}`}

  if(F&&t.dataset.pay!==undefined){F.payments[+t.dataset.pay][t.dataset.f]=t.value;live_();return}
  if(t.dataset.flatfield){const fid=t.dataset.flat,cur=S.flats.find(x=>x.id===fid)||{id:fid,name:FLATS[fid].name,loc:FLATS[fid].loc};await put('flats',{...cur,[t.dataset.flatfield]:numIn(t.value)});return}
  if(t.dataset.lwprice){const [a,b,n]=t.dataset.lwprice.split('|'),fid=t.dataset.flat,v=numIn(t.value),r=lwRow(fid,{from:a,to:b});if(r)await put('rates',{...r,price:v});else if(v!=null)await put('rates',{id:uuid(),flat:fid,type:'especial',name:n,from_date:a,to_date:b,price:v,price_we:null});return}
  if(t.dataset.addhol!==undefined){if(!t.value)return;const [a,b,n]=t.value.split('|');await put('rates',{id:uuid(),flat:t.dataset.flat,type:'especial',name:n,from_date:a,to_date:b,price:null,price_we:null});return}
  if(t.dataset.rate&&t.dataset.part){const r=S.rates.find(x=>x.id===t.dataset.rate);if(!r)return;const f=t.dataset.f,cur=r[f]||'2000-01-01';let m=+cur.slice(5,7)||1,d=+cur.slice(8,10)||1;if(t.dataset.part==='d')d=+t.value;else m=+t.value;d=Math.min(d,[31,29,31,30,31,30,31,31,30,31,30,31][m-1]);await put('rates',{...r,[f]:'2000-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0')});return}
  if(t.dataset.rate){const r=S.rates.find(x=>x.id===t.dataset.rate);if(!r)return;const row={...r};let v=t.value;if(t.dataset.f==='price'||t.dataset.f==='price_we')v=numIn(v);if(v===''&&t.dataset.f!=='name')v=null;row[t.dataset.f]=v;await put('rates',row)}
});

(async function boot(){
  me=await Data.user();
  if(me)await reload();else{me=false;render()}
})();
})();
</script>
